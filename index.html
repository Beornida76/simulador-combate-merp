<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Combate MERP Total</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>⚔️ Simulador de Combate Total - MERP ⚔️</h1>
    <p>Motor de simulación táctica fiel al manual de papel de 1989</p>

    <div class="combat-container">
        <!-- CUADRO ATACANTE -->
        <div class="character-box attacker">
            <h2>⚔️ Personaje Atacante</h2>
            
            <div class="input-group">
                <label for="raza-atq">Raza:</label>
                <select id="raza-atq">
                    <option value="humano">🧑 Humano (Dúnadan)</option>
                    <option value="elfo">🧝 Elfo (Alto Elfo)</option>
                    <option value="enano">🧔 Enano (Lina-Larga)</option>
                    <option value="orco">👹 Orco (Uruk-hai)</option>
                    <option value="hobbit">🦶 Hobbit (Mediano)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="arma">Arma Activa:</label>
                <select id="arma">
                    <optgroup label="🗡️ Armas de Filo">
                        <option value="espada_ancha">Espada Ancha</option>
                        <option value="espada_corta">Espada Corta</option>
                        <option value="daga">Daga / Puñal</option>
                        <option value="cimitarra">Cimitarra</option>
                    </optgroup>
                    <optgroup label="🪓 Armas Contundentes">
                        <option value="maza">Maza</option>
                        <option value="martillo">Martillo de Guerra</option>
                    </optgroup>
                    <optgroup label="🏋️ Armas a Dos Manos">
                        <option value="gran_hacha">Gran Hacha</option>
                        <option value="mandoble">Mandoble (Espadón)</option>
                    </optgroup>
                    <optgroup label="🏹 Armas de Proyectil">
                        <option value="arco_largo">Arco Largo</option>
                        <option value="arco_corto">Arco Corto</option>
                        <option value="honda">Honda Hobbit</option>
                    </optgroup>
                </select>
            </div>

            <div class="input-group">
                <label for="bo">Bono de Ofensiva (BO) Base:</label>
                <input type="number" id="bo" value="50">
            </div>

            <div class="modifiers-section">
                <h3>Modificadores de Asalto</h3>
                <label class="checkbox-label"><input type="checkbox" id="mod-flanco"> ↩️ Ventaja de Flanco (+15 BO)</label>
                <label class="checkbox-label"><input type="checkbox" id="mod-espalda"> 👤 Ataque por la Espalda (+35 BO)</label>
                <label class="checkbox-label"><input type="checkbox" id="mod-atq-aturdido"> 😵 Atacante Aturdido (-20 BO)</label>
                <label class="checkbox-label"><input type="checkbox" id="mod-atq-herido"> 🩸 Atacante Herido Grave (-10 BO)</label>
            </div>
        </div>

        <!-- CUADRO DEFENSOR -->
        <div class="character-box defender">
            <h2>🛡️ Personaje Defensor</h2>

            <div class="input-group">
                <label for="raza-def">Raza:</label>
                <select id="raza-def">
                    <option value="humano">🧑 Humano (Dúnadan)</option>
                    <option value="elfo">🧝 Elfo (Alto Elfo)</option>
                    <option value="enano">🧔 Enano (Lina-Larga)</option>
                    <option value="orco">👹 Orco (Uruk-hai)</option>
                    <option value="hobbit">🦶 Hobbit (Mediano)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="ta">Armadura Equipada:</label>
                <select id="ta">
                    <option value="1">👕 TA 1: Ropa normal (Sin armadura)</option>
                    <option value="2">👕 TA 2: Ropa acolchada pesada</option>
                    <option value="5">🧥 TA 5: Cuero flexible ligero</option>
                    <option value="9">🛡️ TA 9: Cuero endurecido (Coraza)</option>
                    <option value="13">⛓️ TA 13: Cota de malla ligera</option>
                    <option value="15">⛓️ TA 15: Cota de malla completa</option>
                    <option value="17">🦾 TA 17: Placas parciales</option>
                    <option value="20">🦾 TA 20: Placas completas</option>
                </select>
            </div>

            <div class="input-group">
                <label for="bd">Bono de Defensa (BD) Base:</label>
                <input type="number" id="bd" value="15">
            </div>

            <!-- NUEVAS MECÁNICAS DE DEFENSA ACTIVA -->
            <div class="input-group">
                <label class="checkbox-label" style="font-weight: bold; color: #ffcc00; margin-top: 10px;">
                    <input type="checkbox" id="def-escudo"> 🛡️ Equipar Escudo (+20 BD)
                </label>
            </div>

            <div class="input-group">
                <label for="def-parar">⚔️ Puntos para Parar (Usa su BO):</label>
                <input type="number" id="def-parar" value="0" min="0">
                <small style="color: #aaa; display:block; margin-top:4px;">Resta BO de su próximo turno para ganar BD ahora.</small>
            </div>

            <div class="modifiers-section">
                <h3>Estado Defensivo</h3>
                <label class="checkbox-label"><input type="checkbox" id="mod-def-aturdido"> 🥴 Defensor Aturdido (Pierde Agilidad/Escudo)</label>
                <label class="checkbox-label"><input type="checkbox" id="mod-def-sorprendido"> 😮 Defensor Sorprendido (-20 BD)</label>
            </div>
        </div>
    </div>

    <button id="roll-btn">🎲 ¡Lanzar Dados (1d100 MERP)! 🎲</button>
    <div id="dice-container" class="dice">100</div>
    <div id="result-box" class="result-box" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
